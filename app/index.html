                ctx.fillRect(-square.size/2, -square.size/2, square.size, square.size);
                ctx.restore();
            }
            ctx.restore();
        }

        function updateMonsters() {
            // Only update monsters during active gameplay
            if (!gameRunning || gameState === 'gameOver' || gameState === 'nameEntry') return;
            
            // Calculate monster speed based on wave timer and freeze effect
            let moveThreshold;
            
            if (monstersAreFrozen) {
                moveThreshold = MONSTER_CONFIG.FROZEN_MOVE_TICKS;
                if (monstersAreFast) {
                    monstersAreFast = false; // Reset when frozen
                }
            } else if (monsterSpawnTimer > getWaveInterval() * MONSTER_CONFIG.FAST_WAVE_FRACTION) {
                moveThreshold = MONSTER_CONFIG.NORMAL_MOVE_TICKS;
                if (monstersAreFast) {
                    console.log('[MONSTERS] Speed returned to normal (wave timer above the FAST threshold)');
                    monstersAreFast = false;
                }
            } else {
                moveThreshold = MONSTER_CONFIG.FAST_MOVE_TICKS;
                if (!monstersAreFast && monsters.length > 0) {
                    console.log('[MONSTERS] Speed increased to FAST (wave timer at or below the FAST threshold)');
                    monstersAreFast = true;
                }
            }
            
            for (let i = monsters.length - 1; i >= 0; i--) {
                let monster = monsters[i];
                monster.moveCounter++;
                
                if (monster.moveCounter >= moveThreshold) {
                    monster.moveCounter = 0;
                    
                    monster.x += monster.dx;
                    monster.y += monster.dy;
                    
                    if (monster.x < 0) monster.x = tileCount - 1;
                    if (monster.x >= tileCount) monster.x = 0;
                    if (monster.y < 0) monster.y = tileCount - 1;
                    if (monster.y >= tileCount) monster.y = 0;
                    
                    if (Math.random() < MONSTER_CONFIG.DIRECTION_CHANGE_CHANCE) {
                        monster.dx = Math.random() > 0.5 ? 1 : -1;
                        monster.dy = Math.random() > 0.5 ? 1 : -1;
                    }
                }
            }
            
            // Only run the wave clock if the game has started (startTime is set) and no portal
            if (startTime > 0 && !portal) {
                if (waveDeadline === 0) {
                    waveDeadline = Date.now() + monsterSpawnTimer;
                }
                monsterSpawnTimer = waveDeadline - Date.now();
                
                if (monsterSpawnTimer <= 0) {
                    spawnMonsterSwarm();
                }
            }
        }

        function drawGame() {
            // Always draw background
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (gameState === 'start') {
                // Only draw start animation
                drawStartAnimation();
                return;
            }
            
            // Safety check: clear flash effect if game is over or in name entry
            if ((gameState === 'gameOver' || gameState === 'nameEntry') && flashEffect) {
                console.log('[SAFETY] Force clearing flash effect due to game state:', gameState);
                flashEffect = false;
                flashTimer = 0;
                flashDeadline = 0;
            }
            
            if (flashEffect) {
                // Choose flash color based on type
                ctx.fillStyle = flashType === 'gold' ? '#FFD700' : '#fff'; // Gold for level-up, white for damage
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#000';
                for (let segment of snake) {
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
                }

                if (food) {
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, (gridSize - 2)/2, 0, 2 * Math.PI);
                    ctx.fill();
                }

                if (specialFood) {
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(specialFood.x * gridSize + gridSize/2, specialFood.y * gridSize + gridSize/2, (gridSize - 2)/2, 0, 2 * Math.PI);
                    ctx.fill();
                }

                if (iceFood) {
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(iceFood.x * gridSize + gridSize/2, iceFood.y * gridSize + gridSize/2, (gridSize - 2)/2, 0, 2 * Math.PI);
                    ctx.fill();
                }

                ctx.fillStyle = '#000';
                for (let monster of monsters) {
                    let centerX = monster.x * gridSize + gridSize/2;
                    let centerY = monster.y * gridSize + gridSize/2;
                    let size = (gridSize - 2) / 2;
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY - size);     // top
                    ctx.lineTo(centerX + size, centerY);     // right  
                    ctx.lineTo(centerX, centerY + size);     // bottom
                    ctx.lineTo(centerX - size, centerY);     // left
                    ctx.closePath();
                    ctx.fill();
                }
            } else {
                ctx.fillStyle = '#0f0';
                for (let segment of snake) {
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
                }

                if (food) {
                    ctx.fillStyle = '#f00';
                    ctx.beginPath();
                    ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, (gridSize - 2)/2, 0, 2 * Math.PI);
                    ctx.fill();
                }

                if (specialFood) {
                    ctx.fillStyle = '#ffff00'; // Bright yellow
                    ctx.beginPath();
                    ctx.arc(specialFood.x * gridSize + gridSize/2, specialFood.y * gridSize + gridSize/2, (gridSize - 2)/2, 0, 2 * Math.PI);
                    ctx.fill();
                }

                if (iceFood) {
                    ctx.fillStyle = '#00ffff'; // Bright cyan (ICE color)
                    ctx.beginPath();
                    ctx.arc(iceFood.x * gridSize + gridSize/2, iceFood.y * gridSize + gridSize/2, (gridSize - 2)/2, 0, 2 * Math.PI);
                    ctx.fill();
                }

                if (portal) {
                    // Draw portal wall with white borders (no fill)
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    
                    // Draw all wall blocks as white border rectangles
                    for (let wallBlock of portal.wallBlocks) {
                        // Skip gateway positions (create the opening)
                        let isGateway = portal.gatewayBlocks.some(gateway => 
                            gateway.x === wallBlock.x && gateway.y === wallBlock.y
                        );
                        
                        if (!isGateway) {
                            ctx.strokeRect(wallBlock.x * gridSize + 1, wallBlock.y * gridSize + 1, gridSize - 2, gridSize - 2);
                        }
                    }
                }

                ctx.fillStyle = '#800080';
                for (let monster of monsters) {
                    let centerX = monster.x * gridSize + gridSize/2;
                    let centerY = monster.y * gridSize + gridSize/2;
                    let size = (gridSize - 2) / 2;
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY - size);     // top
                    ctx.lineTo(centerX + size, centerY);     // right  
                    ctx.lineTo(centerX, centerY + size);     // bottom
                    ctx.lineTo(centerX - size, centerY);     // left
                    ctx.closePath();
                    ctx.fill();
                }
            }
            
            // Draw game over animation on top of everything
            drawGameOverAnimation();
        }

        // ===========================================
        // MOVEMENT TRACKING (for collision debugging)
        // ===========================================
        
        function recordMovement(fromX, fromY, toX, toY, dirX, dirY) {
            const directionNames = {
                '0,-1': 'UP',
                '0,1': 'DOWN', 
                '-1,0': 'LEFT',
                '1,0': 'RIGHT'
            };
            
            const movement = {
                from: {x: fromX, y: fromY},
                to: {x: toX, y: toY},
                direction: directionNames[dirX + ',' + dirY] || `(${dirX},${dirY})`,
                snakeLength: snake.length,
                timestamp: Math.floor((Date.now() - startTime) / 1000 * 10) / 10 // Time in 0.1s precision
            };
            
            movementHistory.push(movement);
            
            // Keep only last 10 movements
            if (movementHistory.length > 10) {
                movementHistory.shift();
            }
        }
        
        function getMovementSummary() {
            if (movementHistory.length === 0) return 'No movement history';
            
            // Show current snake state
            let summary = `Snake length: ${snake.length}, segments: [`;
            for (let i = 0; i < snake.length; i++) {
                summary += `(${snake[i].x},${snake[i].y})`;
                if (i < snake.length - 1) summary += ', ';
            }
            summary += ']. Last 3 moves: ';
            
            // Show only last 3 movements to keep it concise
            const recent = movementHistory.slice(-3);
            
            for (let i = 0; i < recent.length; i++) {
                const move = recent[i];
                summary += `${move.direction} to (${move.to.x},${move.to.y})`;
                if (i < recent.length - 1) summary += ' → ';
            }
            
            return summary;
        }

        // ===========================================
        // CORE GAME LOGIC (STATE3-5)
        // ===========================================
        
        // Main game update (STATE3: no monsters, STATE4: with monsters, STATE5: portal only)
        function updateGame() {
            if (!gameRunning || (dx === 0 && dy === 0)) return;
            
            // Safety check - if game is already ending, don't process
            if (gameState === 'gameOver' || gameState === 'nameEntry') {
                return;
            }
            
            // Safety check - ensure snake array is valid
            if (!snake || snake.length === 0 || !snake[0]) {
                console.log('[SAFETY] Snake array corrupted, calling gameOver():', snake);
                gameOver();
                return;
            }
            
            // Start timer on first movement
            if (startTime === 0) {
                startTime = Date.now();
            }

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;
            
            // Record this movement for debugging
            recordMovement(snake[0].x, snake[0].y, head.x, head.y, dx, dy);

            // Check self-collision with any body segment (including neck)
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    console.log('[COLLISION] Self-collision detected at (' + head.x + ',' + head.y + ') - ' + getMovementSummary());
                    gameOver();
                    return;
                }
            }

            // Check ALL monster collisions in one pass to prevent conflicts
            let headCollision = false;
            let bodyCollisionIndex = -1;
            let tailCut = false;
            
            
            // First, check if head will collide with any monster
            for (let monster of monsters) {
                if (head.x === monster.x && head.y === monster.y) {
                    headCollision = true;
                    console.log('[STATE4→6] HEAD COLLISION detected - head:', head.x, head.y, 'monster:', monster.x, monster.y);
                    debugLog('[STATE4→6] This should trigger death, NOT body collision');
                    break;
                }
            }
            
            // If head collision, immediate death - don't add head to snake
            if (headCollision) {
                console.log('[COLLISION] Monster head collision at (' + head.x + ',' + head.y + ') - ' + getMovementSummary());
                gameOver();
                return;
            }
            
            // No head collision, safe to add head to snake
            snake.unshift(head);
            playMoveSound();
            
            // Now check body collisions (excluding the head we just added at index 0)
            for (let i = 1; i < snake.length; i++) {
                let segment = snake[i];
                for (let monster of monsters) {
                    if (segment.x === monster.x && segment.y === monster.y) {
                        if (bodyCollisionIndex === -1) {  // Only record first collision
                            bodyCollisionIndex = i;
                            console.log('[STATE4] BODY COLLISION detected - segment', i, 'pos:', segment.x, segment.y, 'monster:', monster.x, monster.y);
                        }
                    }
                }
            }
            
            // Process body collision if found
            if (bodyCollisionIndex !== -1) {
                debugLog('[STATE4] Processing body collision - cutting tail at segment', bodyCollisionIndex, 'gameRunning:', gameRunning);
                debugLog('[STATE4] Snake before cut:', snake.length, 'segments');
                playCutSound();
                triggerFlash();
                snake = snake.slice(0, bodyCollisionIndex);
                tailCut = true; // The cut already discarded the tail; movement must not pop again
                debugLog('[STATE4] Snake after cut:', snake.length, 'segments');
                
                // Safety check: if snake becomes empty, game over
                if (snake.length === 0) {
                    console.log('[STATE4→6] Snake array empty after cut - Game Over');
                    gameOver();
                    return;
                }
                
                // Log if snake is cut down to just head (length=1) - this is valid and should continue playing
                if (snake.length === 1) {
                    debugLog('[STATE4] Snake cut down to head only (length=1) - continuing game');
                }
                
                debugLog('[STATE4] Cut completed successfully, continuing game loop');
            }

            // Check portal collision - gateway vs wall
            if (portal) {
                // Check if snake hits gateway blocks (successful portal entry)
                for (let gatewayBlock of portal.gatewayBlocks) {
                    if (head.x === gatewayBlock.x && head.y === gatewayBlock.y) {
                        enterPortal();
                        return;
                    }
                }
                
                // Check if snake hits wall blocks (death by wall collision)
                for (let wallBlock of portal.wallBlocks) {
                    // Skip gateway positions (already handled above)
                    let isGateway = portal.gatewayBlocks.some(gateway => 
                        gateway.x === wallBlock.x && gateway.y === wallBlock.y
                    );
                    
                    if (!isGateway && head.x === wallBlock.x && head.y === wallBlock.y) {
                        console.log('[COLLISION] Hit portal wall at (' + head.x + ',' + head.y + ') - must aim for gateway!');
                        gameOver();
                        return;
                    }
                }
            }
            
            if (food && head.x === food.x && head.y === food.y) {
                playEatSound();
                foodScore += SCORING_CONFIG.RED_APPLE; // Red apple points
                console.log('[FOOD] Red apple eaten - +' + SCORING_CONFIG.RED_APPLE + ' points, total food score:', foodScore);
                if (!portal) { // Only generate new food if no portal is active
                    generateFood();
                }
            } else if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
                playBonusSound();
                // Double the snake size - use length BEFORE head was added
                let originalLength = snake.length - 1; // Length before head was added
                let targetLength = originalLength * 2; // True double of original length
                let doublingSegments = targetLength - snake.length; // Additional segments for doubling
                let totalSegmentsAdded = originalLength; // Head + doubling segments = original length
                let pointsAdded = SCORING_CONFIG.YELLOW_APPLE_PER_SEGMENT * totalSegmentsAdded; // Yellow apple points per segment
                foodScore += pointsAdded;
                
                console.log('[FOOD] Yellow apple eaten - snake doubled from', originalLength, 'to', targetLength, 'segments, +' + pointsAdded, 'points');
                
                for (let i = 0; i < doublingSegments; i++) {
                    // Add segments at the tail
                    let lastSegment = snake[snake.length - 1];
                    snake.push({x: lastSegment.x, y: lastSegment.y});
                }
                specialFood = null;
                specialFoodTimer = 0;
                specialFoodDeadline = 0;
            } else if (iceFood && head.x === iceFood.x && head.y === iceFood.y) {
                playBonusSound();
                // ICE apple effect: freeze monsters for remainder of current wave
                monstersAreFrozen = true;
                freezeTimer = monsterSpawnTimer; // Freeze for remainder of current wave
                freezeDeadline = Date.now() + freezeTimer;
                foodScore += SCORING_CONFIG.ICE_APPLE; // ICE apple flat bonus
                
                console.log('[FOOD] ICE apple eaten - +' + SCORING_CONFIG.ICE_APPLE + ' points, monsters frozen for', Math.ceil(freezeTimer / 1000), 'seconds');
                iceFood = null;
                iceFoodTimer = 0;
                iceFoodDeadline = 0;
            } else if (!tailCut) {
                snake.pop();
            }
            
        }

        // ===========================================
        // GAME STATE TRANSITIONS
        // ===========================================
        
        // Transition to STATE6 (Game Over)
        function gameOver() {
            console.log('[GAME] Game Over - final score:', timeScore + foodScore, 'time:', (timeScore/SCORING_CONFIG.TIME_POINTS_PER_SECOND).toFixed(1) + 's', 'food:', foodScore);
            gameRunning = false;
            playDeathSound();
            
            // Clear flash effect to prevent white screen
            flashEffect = false;
            flashTimer = 0;
            flashDeadline = 0;
            
            // Calculate final score
            if (startTime > 0) {
                // Use the already calculated timeScore from updateTimer() to avoid discrepancy
                totalScore = timeScore + foodScore;
                debugLog('[STATE6] Final score breakdown: timeScore =', timeScore, 'foodScore =', foodScore, 'totalScore =', totalScore);
                
                // Check if it's a high score
                if (checkHighScore(totalScore)) {
                    gameState = 'nameEntry';
                    nameEntry = '';
                    updateNameInput();
                } else {
                    gameState = 'gameOver';
                }
            } else {
                gameState = 'gameOver';
            }
            
            createGameOverAnimation();
        }

        // Transition to STATE2 (Static Pre-Game)
        function startGame() {
            console.log('[GAME] Game started - entering STATE2 (pre-game)');
            gameState = 'playing';
            startAnimation = false;
            gameRunning = true;
            selectRandomTip();
            generateFood();
            
            // Initialize audio safely (non-blocking for iOS)
            try {
                initAudio();
            } catch(e) {
                console.log('[SOUND] Audio initialization failed, continuing without sound:', e);
            }
        }

        // Reset to STATE2 (after game over)
        function resetGame() {
            console.log('[GAME] Game reset - starting new game');
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            movementHistory = []; // Clear movement history
            startTime = 0;
            document.getElementById('timeDisplay').textContent = '0.00s';
            timeScore = 0;
            timeScoreBase = 0;
            foodScore = 0;
            totalScore = 0;
            levelStartScore = 0;
            lastMilestone = 0; // Reset milestone tracking
            document.getElementById('foodScore').textContent = '0';
            document.getElementById('totalScore').textContent = '0';
            gameRunning = true;
            gameState = 'playing';
            monsters = [];
            portal = null;
            portalTimer = 0;
            portalDeadline = 0;
            portalWarningShown = false;
            level = 1;
            swarmRound = 1;
            monsterSpawnTimer = getWaveInterval(); // Will be 30000 for level 1
            waveDeadline = 0;
            flashEffect = false;
            flashTimer = 0;
            flashDeadline = 0;
            specialFood = null;
            specialFoodTimer = 0;
            specialFoodDeadline = 0;
            iceFood = null;
            iceFoodTimer = 0;
            iceFoodDeadline = 0;
            monstersAreFrozen = false;
            freezeTimer = 0;
            freezeDeadline = 0;
            gameOverAnimation = false;
            animatedSquares = [];
            selectRandomTip();
            generateFood();
        }

        // Transition to STATE1 (Start Screen)
        function showStartScreen() {
            gameState = 'start';
            startAnimation = true;
            gameRunning = false;
            showIntroTip();
            createStartAnimation();
        }

        // A monster can move onto the head after the snake has moved - the overlap still kills
        function checkMonsterHeadCollision() {
            if (!gameRunning || gameState === 'gameOver' || gameState === 'nameEntry') return;
            if (!snake || snake.length === 0) return;
            
            const head = snake[0];
            for (const monster of monsters) {
                if (monster.x === head.x && monster.y === head.y) {
                    console.log('[COLLISION] Monster moved onto the head at (' + head.x + ',' + head.y + ') - Game Over');
                    gameOver();
                    return;
                }
            }
        }
        
        // ===========================================
        // MAIN GAME LOOP (manages all 7 states)
        // ===========================================
        
        let hiddenAt = 0;
        
        // Shift every wall-clock deadline by the time the tab spent hidden
        function shiftDeadlines(delta) {
            if (startTime > 0) startTime += delta;
            if (flashDeadline > 0) flashDeadline += delta;
            if (portalDeadline > 0) portalDeadline += delta;
            if (waveDeadline > 0) waveDeadline += delta;
            if (freezeDeadline > 0) freezeDeadline += delta;
            if (specialFoodDeadline > 0) specialFoodDeadline += delta;
            if (iceFoodDeadline > 0) iceFoodDeadline += delta;
        }
        
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                hiddenAt = Date.now();
            } else if (hiddenAt > 0) {
                shiftDeadlines(Date.now() - hiddenAt);
                hiddenAt = 0;
            }
        });
        
        function gameLoop() {
            if (document.visibilityState === 'hidden') return; // Paused while the tab is hidden
            
            // Debug: Track game loop execution
            if (flashEffect) {
                debugLog('[GAME LOOP] Flash active, timer:', flashTimer);
            }
            
            if (gameState === 'start') {              // STATE1
                updateStartAnimation();
            } else {                                  // STATE2-7
                updateGame();                         // STATE3-5 (snake movement)
                updateMonsters();                     // STATE4 only (monster movement/spawning)  
                checkMonsterHeadCollision();          // STATE4 (a monster may have landed on the head)
                updateSpecialFood();                  // STATE3-4 (yellow apple spawning)
                updateFlash();                        // STATE4 (flash effects)
                updateGameOverAnimation();            // STATE6 (bouncing squares)
                updateTimer();                        // STATE3-5 (scoring)
                updatePortalTimer();                  // STATE5 (portal countdown)
            }
            updateUnifiedMessage();                   // All states (message updates)
            drawGame();                               // All states (rendering)
        }

        // ===========================================
        // INPUT HANDLING (different behavior per state)
        // ===========================================
        
        // Predicts a move that would hit the neck (segment 1), regardless of current direction
        function wouldHitNeck(newDx, newDy) {
            if (snake.length <= 1) return false; // Can't hit neck if only head exists
            
            const head = snake[0];
            const neck = snake[1]; // Segment 1 is always the neck
            const newHeadX = head.x + newDx;
            const newHeadY = head.y + newDy;
            
            // Direct position check - prevents false collision deaths
            return newHeadX === neck.x && newHeadY === neck.y;
        }
        
        document.addEventListener('keydown', (e) => {
            if (['Space', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();                  // Keep gameplay keys from scrolling the page
            }
            
            if (gameState === 'start') {             // STATE1: Any key starts game
                startGame();                         // STATE1→STATE2 transition
                return;
            }
            
            if (gameState === 'nameEntry') {         // STATE7: Name entry controls
                if (e.code === 'Enter' && nameEntry.length >= 1) {
                    addHighScore(nameEntry, totalScore);
                    gameState = 'gameOver';
                    return;
                } else if (e.code === 'Space') {
                    gameState = 'gameOver';          // Decline entry without saving
                    return;
                } else if (e.code === 'Backspace' && nameEntry.length > 0) {
                    nameEntry = [...nameEntry].slice(0, -1).join('');
                    updateNameInput();
                    return;
                } else if ([...nameEntry].length < HIGH_SCORE_CONFIG.MAX_NAME_LENGTH && /^\S$/u.test(e.key)) {
                    nameEntry += e.key.toUpperCase();
                    updateNameInput();
                    return;
                }
                return;
            }
            
            if (!gameRunning && e.code === 'Space') { // STATE6: Space to restart
                resetGame();                           // STATE6→STATE2 transition
                return;
            }

            if (!gameRunning) return;

            // STATE2-5: Arrow key controls (STATE2→3 on first move)
            switch(e.code) {
                case 'ArrowUp':
                    if (!wouldHitNeck(0, -1)) {
                        debugLog('[INPUT] UP accepted - snake length:', snake.length, 'dx:', dx, 'dy:', dy);
                        dx = 0;
                        dy = -1;
                    } else {
                        debugLog('[INPUT] UP blocked - would hit neck at (' + snake[1].x + ',' + snake[1].y + ')');
                    }
                    break;
                case 'ArrowDown':
                    if (!wouldHitNeck(0, 1)) {
                        debugLog('[INPUT] DOWN accepted - snake length:', snake.length, 'dx:', dx, 'dy:', dy);
                        dx = 0;
                        dy = 1;
                    } else {
                        debugLog('[INPUT] DOWN blocked - would hit neck at (' + snake[1].x + ',' + snake[1].y + ')');
                    }
                    break;
                case 'ArrowLeft':
                    if (!wouldHitNeck(-1, 0)) {
                        debugLog('[INPUT] LEFT accepted - snake length:', snake.length, 'dx:', dx, 'dy:', dy);
                        dx = -1;
                        dy = 0;
                    } else {
                        debugLog('[INPUT] LEFT blocked - would hit neck at (' + snake[1].x + ',' + snake[1].y + ')');
                    }
                    break;
                case 'ArrowRight':
                    if (!wouldHitNeck(1, 0)) {
                        debugLog('[INPUT] RIGHT accepted - snake length:', snake.length, 'dx:', dx, 'dy:', dy);
                        dx = 1;
                        dy = 0;
                    } else {
                        debugLog('[INPUT] RIGHT blocked - would hit neck at (' + snake[1].x + ',' + snake[1].y + ')');
                    }
                    break;
            }
        });

        // Touch: swipe steers, tap starts/restarts/declines
        let touchStartPosition = null;
        
        function handleTouchTap() {
            if (gameState === 'start') {             // STATE1→STATE2
                startGame();
            } else if (gameState === 'nameEntry') {  // STATE7: decline without saving
                gameState = 'gameOver';
            } else if (gameState === 'gameOver' && !gameRunning) { // STATE6→STATE2
                resetGame();
            }
        }
        
        function handleTouchSwipe(deltaX, deltaY) {
            if (gameState !== 'playing' || !gameRunning) return;
            
            if (Math.abs(deltaX) >= Math.abs(deltaY)) {
                if (deltaX > 0 && !wouldHitNeck(1, 0)) { dx = 1; dy = 0; }
                else if (deltaX < 0 && !wouldHitNeck(-1, 0)) { dx = -1; dy = 0; }
            } else {
                if (deltaY > 0 && !wouldHitNeck(0, 1)) { dx = 0; dy = 1; }
                else if (deltaY < 0 && !wouldHitNeck(0, -1)) { dx = 0; dy = -1; }
            }
        }
        
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            touchStartPosition = { x: touch.clientX, y: touch.clientY };
            e.preventDefault();
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            if (!touchStartPosition) return;
            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - touchStartPosition.x;
            const deltaY = touch.clientY - touchStartPosition.y;
            touchStartPosition = null;
            e.preventDefault();
            
            if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < TOUCH_CONFIG.SWIPE_MIN_DISTANCE) {
                handleTouchTap();
            } else {
                handleTouchSwipe(deltaX, deltaY);
            }
        }, { passive: false });
        
        canvas.addEventListener('touchcancel', () => {
            touchStartPosition = null;
        });

        // ===========================================
        // GAME INITIALIZATION
        // ===========================================
        
        console.log('[GAME] Game loaded - Serpent Swarm ' + GAME_VERSION + ' initialized');
        loadHighScores();        // Load saved high scores
        displayHighScores();     // Display high scores initially
        showIntroTip();          // Set STATE1 tip
        showStartScreen();       // Enter STATE1
        console.log('[GAME] Game loop started - 120ms intervals');
        setInterval(gameLoop, 120); // 120ms = 20% faster than standard (150ms)
    </script>
</body>
</html>
