 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Serpent Swarm</title>
    <link rel="icon" href="data:image/x-icon;base64,">
    <link rel="shortcut icon" href="data:image/x-icon;base64,">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 10px 0;
            background: 
                radial-gradient(rgba(0, 255, 100, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #0a0a0a;
            font-family: Arial, sans-serif;
            overflow: auto;
            box-sizing: border-box;
        }
        .main-layout {
            display: flex;
            align-items: center;
            gap: 40px;
            transform-origin: top center;
            transition: transform 0.3s ease;
        }
        .left-sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 250px;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 250px;
        }
        .game-container {
            text-align: center;
        }
        .title-container {
            background: linear-gradient(145deg, 
                rgba(255, 0, 255, 0.15), 
                rgba(150, 0, 150, 0.1), 
                rgba(255, 0, 255, 0.05)
            );
            border: 2px solid #ff00ff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            box-shadow: 
                0 0 25px rgba(255, 0, 255, 0.4),
                inset 0 0 25px rgba(255, 0, 255, 0.1);
            position: relative;
            overflow: hidden;
            animation: titleBoxGlow 4s ease-in-out infinite alternate;
        }
        .title-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                transparent, 
                rgba(255, 0, 255, 0.3), 
                transparent, 
                rgba(255, 0, 255, 0.3), 
                transparent
            );
            background-size: 400% 400%;
            border-radius: 12px;
            z-index: -1;
            animation: borderFlow 8s linear infinite;
        }
        @keyframes titleBoxGlow {
            from { 
                box-shadow: 
                    0 0 25px rgba(255, 0, 255, 0.4),
                    inset 0 0 25px rgba(255, 0, 255, 0.1);
            }
            to { 
                box-shadow: 
                    0 0 35px rgba(255, 0, 255, 0.6),
                    inset 0 0 35px rgba(255, 0, 255, 0.15);
            }
        }
        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .game-title {
            font-family: monospace;
            font-size: 40px;
            font-weight: 600;
            color: #00ff88;
            margin: 0;
            text-shadow: none;
            letter-spacing: 2px;
            position: relative;
        }
        .game-canvas-container {
            position: relative;
            border: 2px solid #00ff88;
            border-radius: 8px;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.3),
                inset 0 0 20px rgba(0, 255, 136, 0.1);
        }
        canvas {
            background-color: #0d0d0d;
            display: block;
            border-radius: 6px;
            touch-action: none;
        }
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                transparent 50%, 
                rgba(0, 255, 136, 0.03) 50%
            );
            background-size: 100% 4px;
            border-radius: 6px;
        }
        .score {
            font-family: monospace;
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 20px;
            background: linear-gradient(145deg, rgba(0, 255, 255, 0.05), rgba(0, 255, 255, 0.02));
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            text-align: left;
            line-height: 1.4;
            width: 100%;
            height: 140px;
            box-shadow: 
                0 0 15px rgba(0, 255, 255, 0.3),
                inset 0 0 15px rgba(0, 255, 255, 0.1);
        }
        .score h3 {
            font-family: monospace;
            color: #00ffff;
            margin: 0 0 10px 0;
            font-size: 16px;
            text-shadow: 0 0 6px rgba(0, 255, 255, 0.64);
            font-weight: 600;
        }
        .score span {
            color: #ccc;
            font-family: monospace;
        }
        .game-over {
            color: #ff0000;
            font-size: 32px;
            margin-top: 10px;
        }
        .unified-message {
            font-family: monospace;
            font-size: 20px;
            font-weight: 500;
            color: #ff00ff;
            margin: 20px 0;
            text-align: center;
            text-shadow: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .version {
            color: #666;
            font-size: 10px;
            font-family: monospace;
            text-align: center;
            margin-top: 10px;
        }
        .high-scores {
            font-family: monospace;
            color: #ffff00;
            font-size: 14px;
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
            background: linear-gradient(145deg, rgba(255, 255, 0, 0.05), rgba(255, 255, 0, 0.02));
            border: 1px solid #ffff00;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            height: 180px;
            overflow: hidden;
            box-shadow: 
                0 0 15px rgba(255, 255, 0, 0.3),
                inset 0 0 15px rgba(255, 255, 0, 0.1);
        }
        .high-scores h3 {
            font-family: monospace;
            color: #ffff00;
            margin: 0 0 10px 0;
            font-size: 16px;
            text-shadow: 0 0 6px rgba(255, 255, 0, 0.64);
            font-weight: 600;
        }
        .high-score-entry {
            margin: 5px 0;
            font-family: monospace;
            line-height: 1.4;
            color: #ccc;
        }
        .name-entry {
            color: #ff6600;
            margin: 20px 0;
            font-size: 18px;
            background: linear-gradient(145deg, rgba(255, 102, 0, 0.05), rgba(255, 102, 0, 0.02));
            border: 1px solid #ff6600;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            line-height: 1.4;
            box-shadow: 
                0 0 15px rgba(255, 102, 0, 0.3),
                inset 0 0 15px rgba(255, 102, 0, 0.1);
        }
        .name-input {
            font-family: monospace;
            font-size: 24px;
            color: #ff6600;
            margin: 10px 0;
            letter-spacing: 4px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .tips {
            font-family: monospace;
            color: #00ff88;
            font-size: 14px;
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
            background: linear-gradient(145deg, rgba(0, 255, 136, 0.05), rgba(0, 255, 136, 0.02));
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            height: 140px;
            overflow: hidden;
            box-shadow: 
                0 0 15px rgba(0, 255, 136, 0.3),
                inset 0 0 15px rgba(0, 255, 136, 0.1);
        }
        .tips h3 {
            font-family: monospace;
            color: #00ff88;
            margin: 0 0 10px 0;
            font-size: 16px;
            text-shadow: 0 0 6px rgba(0, 255, 136, 0.64);
            font-weight: 600;
        }
        .tip-content {
            line-height: 1.4;
            color: #ccc;
            font-family: monospace;
        }
        .legend {
            font-family: monospace;
            color: #ffaa00;
            font-size: 14px;
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
            background: linear-gradient(145deg, rgba(255, 170, 0, 0.05), rgba(255, 170, 0, 0.02));
            border: 1px solid #ffaa00;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            height: 180px;
            box-shadow: 
                0 0 15px rgba(255, 170, 0, 0.3),
                inset 0 0 15px rgba(255, 170, 0, 0.1);
        }
        .legend h3 {
            font-family: monospace;
            color: #ffaa00;
            margin: 0 0 10px 0;
            font-size: 16px;
            text-shadow: 0 0 6px rgba(255, 170, 0, 0.64);
            font-weight: 600;
        }
        .legend-content {
            line-height: 1.4;
            color: #ccc;
            font-family: monospace;
            text-transform: uppercase;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-square {
            width: 14px;
            height: 14px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .legend-circle {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .legend-diamond {
            width: 14px;
            height: 14px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: transparent;
        }
        .legend-diamond::before {
            content: '';
            width: 10px;
            height: 10px;
            transform: rotate(45deg);
            position: absolute;
        }
        .legend-snake { background-color: #0f0; }
        .legend-food { background-color: #f00; }
        .legend-special { background-color: #ffff00; }
        .legend-ice { background-color: #00ffff; }
        .legend-monster::before { background-color: #800080; }
        
        .level-announcement {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: monospace;
            font-size: 72px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 40px rgba(255, 255, 255, 0.6),
                0 0 60px rgba(255, 255, 255, 0.4);
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            animation: levelAnnounce 2s ease-out forwards;
        }
        
        @keyframes levelAnnounce {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            40% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        /* Mobile (Strata breakpoint, 768px): board first, panels stacked below */
        body.mobile-layout {
            padding: 8px 0 calc(16px + env(safe-area-inset-bottom));
            overflow: auto;
        }
        body.mobile-layout .main-layout {
            flex-direction: column;
            gap: 14px;
            transform: none;
            width: 100%;
        }
        body.mobile-layout .game-container {
            order: 1;
            width: 100%;
        }
        body.mobile-layout .sidebar {
            order: 2;
        }
        body.mobile-layout .left-sidebar {
            order: 3;
        }
        body.mobile-layout .left-sidebar,
        body.mobile-layout .sidebar {
            width: 92vw;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: center;
            gap: 12px;
        }
        body.mobile-layout .title-container {
            margin-bottom: 12px;
            padding: 10px 14px;
        }
        body.mobile-layout .game-title {
            font-size: 26px;
        }
        body.mobile-layout .unified-message {
            font-size: 15px;
            margin: 10px 0;
            white-space: normal;
        }
        body.mobile-layout .game-canvas-container {
            width: fit-content;
            max-width: 92vw;
            margin: 0 auto;
        }
        body.mobile-layout canvas {
            width: min(92vw, 60vh);
            width: min(92vw, 60dvh);
            height: auto;
        }
        body.mobile-layout .score,
        body.mobile-layout .high-scores,
        body.mobile-layout .name-entry,
        body.mobile-layout .tips,
        body.mobile-layout .legend {
            width: 100%;
            height: auto;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="left-sidebar">
            <div class="tips" id="tips" style="display: none;">
                <h3>💡 TIP</h3>
                <div class="tip-content" id="tipContent"></div>
            </div>
            <div class="legend" id="legend">
                <h3>🎨 LEGEND</h3>
                <div class="legend-content">
                    <div class="legend-item">
                        <div class="legend-square legend-snake"></div>
                        <span>Snake</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-circle legend-food"></div>
                        <span>Red Apple</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-circle legend-special"></div>
                        <span>Yellow Apple</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-circle legend-ice"></div>
                        <span>ICE Apple</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-diamond legend-monster"></div>
                        <span>Monsters</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="game-container">
            <div class="title-container">
                <h1 class="game-title">🐍 Serpent Swarm</h1>
            </div>
            <div class="unified-message" id="unifiedMessage">Press any key to start...</div>
            <div class="game-canvas-container">
                <canvas id="gameCanvas" width="800" height="800"></canvas>
                <div class="scanlines"></div>
                <div id="levelAnnouncement" class="level-announcement" style="display: none;"></div>
            </div>
            <div class="version" id="versionDisplay">
                Level 1<br>
                <!-- Version will be set by JavaScript -->
            </div>
        </div>
        <div class="sidebar">
            <div class="score">
                <h3>📊 SCORE</h3>
                <br>
                ⏱️ Time: <span id="timeDisplay">0.00s</span><br>
                🍎 Food: <span id="foodScore">0</span> pts<br>
                🏆 Total: <span id="totalScore">0</span> pts
            </div>
            <div class="high-scores" id="highScores" style="display: none;">
                <h3>🏆 HIGH SCORES</h3>
                <div id="highScoresList"></div>
            </div>
            <div class="name-entry" id="nameEntryDiv" style="display: none;">
                <div>🎉 NEW HIGH SCORE! 🎉</div>
                <div>✨ Enter your name:</div>
                <div class="name-input" id="nameInput">______</div>
                <div>⌨️ Type 1-6 letters, Enter to confirm</div>
            </div>
        </div>
    </div>

    <script>
        // Documentation moved to GAME_DOCUMENTATION.txt
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const unifiedMessageElement = document.getElementById('unifiedMessage');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Touch input configuration
        const TOUCH_CONFIG = {
            SWIPE_MIN_DISTANCE: 24   // Pixels before a gesture counts as a swipe
        };

        // Monster behaviour configuration
        const MONSTER_CONFIG = {
            FAST_WAVE_FRACTION: 0.5,      // The last half of each wave runs at FAST speed
            FIRST_WAVE_SIZE: 2,           // Monsters in the first swarm
            DOUBLE_UNTIL: 16,             // Waves double up to this count
            WAVE_GROWTH_AFTER: 8,         // Then each wave adds this many instead
            NORMAL_MOVE_TICKS: 3,         // Ticks between moves at normal speed
            FAST_MOVE_TICKS: 2,           // Ticks between moves in the FAST phase
            FROZEN_MOVE_TICKS: 8,         // Ticks between moves while frozen
            DIRECTION_CHANGE_CHANCE: 0.3, // Chance per move that a monster re-rolls direction
            WAVE_BASE_INTERVAL: 35000,    // Wave interval before level scaling
            WAVE_INTERVAL_STEP: 5000,     // Removed from the interval per level
            WAVE_MIN_INTERVAL: 10000      // Interval floor
        };

        // Food spawning configuration
        const FOOD_CONFIG = {
            YELLOW_SPAWN_CHANCE: 0.005, // Per-tick chance to offer the yellow apple
            YELLOW_MIN_DURATION: 2000,  // Yellow apple lifetime range
            YELLOW_MAX_DURATION: 6000,
            ICE_SPAWN_CHANCE: 0.02,     // Per-tick chance to offer the ICE apple
            ICE_MIN_MONSTERS: 16,       // Monster count that unlocks ICE apples
            ICE_DURATION: 10000         // ICE apple lifetime
        };

        // Flash effect configuration
        const FLASH_CONFIG = {
            WHITE_DURATION: 240,   // Damage flash
            GOLD_DURATION: 720     // Level-up flash and announcement delay
        };

        // Layout scaling configuration
        const SCALE_CONFIG = {
            WIDTH_BUFFER: 20,        // Viewport width held back from the layout
            HEIGHT_BUFFER: 30,       // Viewport height held back from the layout
            BODY_HEIGHT_BUFFER: 20,  // Extra body height beyond the scaled layout
            BODY_VIEWPORT_MARGIN: 5, // Minimum gap between body and viewport
            MOBILE_MAX_WIDTH: 768    // Strata phone/desktop breakpoint
        };

        // Logging configuration - verbose internals stay silent unless explicitly enabled
        const LOG_CONFIG = {
            DEBUG: false
        };

        function debugLog(...args) {
            if (LOG_CONFIG.DEBUG) console.log(...args);
        }

        // ===========================================
        // RESPONSIVE SCALING SYSTEM
        // ===========================================
        
        let mobileLayout = false;
        
        function updateGameScale() {
            const mainLayout = document.querySelector('.main-layout');
            const body = document.body;
            
            mobileLayout = window.matchMedia('(max-width: ' + SCALE_CONFIG.MOBILE_MAX_WIDTH + 'px)').matches;
            body.className = mobileLayout ? 'mobile-layout' : '';
            
            if (mobileLayout) {
                // Phones get the board at full width and panels below; nothing is scaled
                mainLayout.style.transform = 'none';
                body.style.height = '';
                body.style.minHeight = '';
                body.style.alignItems = '';
                return;
            }
            
            // Measure the real layout; the transform does not affect layout size
            const totalWidth = mainLayout.offsetWidth || canvas.width;
            const totalHeight = mainLayout.offsetHeight || canvas.height;
            
            // Get available space with buffer to prevent scrollbars
            const availableWidth = window.innerWidth - SCALE_CONFIG.WIDTH_BUFFER;
            const availableHeight = window.innerHeight - SCALE_CONFIG.HEIGHT_BUFFER;
            
            // Calculate scale factors for both dimensions
            const scaleX = availableWidth / totalWidth;
            const scaleY = availableHeight / totalHeight;
            
            // Use the most restrictive scale and cap at 1.0
            const scale = Math.min(scaleX, scaleY, 1.0);
            
            // Calculate actual scaled dimensions
            const scaledHeight = totalHeight * scale;
            
            // Apply scaling
            mainLayout.style.transform = `scale(${scale})`;
            
            // Adjust body to fit scaled content with buffer
            let actualBodyHeight;
            if (scale < 1.0) {
                // Ensure body height stays well within viewport bounds
                actualBodyHeight = Math.min(scaledHeight + SCALE_CONFIG.BODY_HEIGHT_BUFFER, window.innerHeight - SCALE_CONFIG.BODY_VIEWPORT_MARGIN);
                body.style.height = `${actualBodyHeight}px`;
                body.style.minHeight = 'unset';
                body.style.alignItems = 'flex-start';
            } else {
                actualBodyHeight = window.innerHeight;
                body.style.height = '100vh';
                body.style.minHeight = '100vh'; 
                body.style.alignItems = 'center';
            }
            
            // Debug info for development
            if (scale < 1.0) {
                debugLog(`[SCALING] Screen: ${window.innerWidth}x${window.innerHeight}, Required: ${totalWidth}x${totalHeight}, Scale: ${scale.toFixed(2)}, Body Height: ${actualBodyHeight}px`);
            }
        }
        
        // Update scale on load and resize
        window.addEventListener('load', updateGameScale);
        window.addEventListener('resize', updateGameScale);
        updateGameScale();

        // ===========================================
        // GAME STATE VARIABLES
        // ===========================================
        
        // Game version - single source of truth for version number
        const GAME_VERSION = 'V1.2';
        
        // Portal threshold configuration - single source of truth for level progression
        const PORTAL_CONFIG = {
            BASE_THRESHOLD: 35000,     // Level 1: 35k
            BASE_INCREMENT: 35000,     // Base increment amount
            INCREMENT_STEP: 10000,     // Increment growth per level (+10k each level)
            DURATION: 15000,           // Time to reach the gateway
            WARNING_AT: 5000           // Countdown at which the warning is logged
        };
        
        // Scoring configuration - single source of truth for all point values
        const SCORING_CONFIG = {
            RED_APPLE: 500,                    // Red apple points
            YELLOW_APPLE_PER_SEGMENT: 500,    // Yellow apple points per segment added
            ICE_APPLE: 1000,                  // ICE apple flat bonus
            TIME_POINTS_PER_SECOND: 100,      // Timer scoring rate (100 points per second)
            MILESTONE_BONUSES: [10000, 25000, 50000, 100000, 150000, 200000] // Score milestone bonuses
        };

        // Spawn safety configuration - shared by monster swarms and portal placement
        const SPAWN_CONFIG = {
            SAFE_RADIUS: 5,    // Never spawn this close (Manhattan distance) to the snake
            MAX_ATTEMPTS: 50   // Bounded retries before giving up on a free cell
        };

        // Ambient animation configuration (start screen and game-over squares)
        const ANIMATION_CONFIG = {
            MIN_SQUARE_SPEED: 1.0,       // Minimum movement per axis (pixels per tick)
            START_SQUARE_COUNT: 20,      // Purple squares on the start screen
            GAME_OVER_SQUARE_COUNT: 30   // Bouncing squares on game over
        };

        // Core game state - determines which of the 7 states we're in
        let gameState = 'start'; // 'start'=STATE1, 'playing'=STATE2/3/4/5, 'gameOver'=STATE6, 'nameEntry'=STATE7
        let gameRunning = true;    // Controls game logic execution (false in STATE6/7)
        let startTime = 0;         // Timer start (0 in STATE1/2, set in STATE3+)
        let level = 1;             // Portal progression level

        // Snake (visible in STATE2-7, moving in STATE3-5)
        let snake = [
            {x: 10, y: 10}
        ];
        let dx = 0;                // Direction X (0 in STATE1/2, set by arrows in STATE3+)
        let dy = 0;                // Direction Y (0 in STATE1/2, set by arrows in STATE3+)
        let movementHistory = [];  // Track last 10 movements for collision debugging

        // Food elements (STATE3-4 active, cleared in STATE5)
        let food = {};                    // Red apple (visible STATE2-4, null in STATE5)
        let specialFood = null;           // Yellow apple (spawns STATE3-4, cleared in STATE5)
        let specialFoodTimer = 0;         // Remaining lifetime
        let specialFoodDeadline = 0;      // Wall-clock deadline
        let iceFood = null;               // ICE apple (spawns when 16+ monsters, cleared in STATE5)
        let iceFoodTimer = 0;             // Remaining lifetime
        let iceFoodDeadline = 0;          // Wall-clock deadline
        let monstersAreFrozen = false;    // ICE apple effect active
        let freezeTimer = 0;              // Remaining freeze time for current wave
        let freezeDeadline = 0;           // Wall-clock deadline for the freeze effect

        // Monsters (present in STATE4, cleared in STATE5)
        let monsters = [];
        let monsterSpawnTimer = 30000;    // Remaining time until the next wave
        let waveDeadline = 0;             // Wall-clock deadline for the next wave (0 while paused)
        let swarmRound = 1;
        let monstersAreFast = false;      // Track speed state for logging
        
        // Calculate wave interval based on level: 30s, 25s, 20s, 15s, 10s (minimum)
        function getWaveInterval() {

        function initAudio() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // iOS Safari requires user gesture to resume audio context
                    if (audioContext.state === 'suspended') {
                        audioContext.resume().then(() => {
                            console.log('[SOUND] Audio context resumed for iOS/Safari compatibility');
                        }).catch(e => {
                            console.log('[SOUND] Could not resume audio context:', e);
                        });
                    } else {
                        console.log('[SOUND] Audio system initialized - Web Audio API ready');
                    }
                } catch(e) {
                    console.log('[SOUND] Web Audio API not supported - game will run silently');
                    audioContext = null; // Ensure it's null if failed
                }
            }
        }
        
        function playSound(frequency, duration, type = 'square', volume = 0.1) {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(volume, audioContext.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        const HIGH_SCORE_CONFIG = {
            KEY: 'snake_high_scores',

            MAX_ENTRIES: 5,
            MAX_NAME_LENGTH: 6
        };
        
        function readStorage(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                console.log('[HIGH SCORES] localStorage read failed:', e);
                return null;
            }
        }
        
        function writeStorage(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                console.log('[HIGH SCORES] localStorage write failed:', e);
                return false;
            }
        }
        
        function removeStorage(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {
                console.log('[HIGH SCORES] localStorage remove failed:', e);
            }
        }
        
        // Accept only {name: string, score: finite number}; convert the old time-based format
        function sanitizeHighScores(payload) {
            if (!Array.isArray(payload)) return null;
            const entries = [];
            for (const entry of payload) {
                if (!entry || typeof entry !== 'object') continue;
                let score = Number.isFinite(entry.score) ? entry.score
                    : Number.isFinite(entry.time) ? Math.floor(entry.time * SCORING_CONFIG.TIME_POINTS_PER_SECOND)
                    : null;
                if (typeof entry.name !== 'string' || score === null) continue;
                entries.push({ name: entry.name, score: score });
            }
            entries.sort((a, b) => b.score - a.score);
            return entries.slice(0, HIGH_SCORE_CONFIG.MAX_ENTRIES);
        }
        
        function loadHighScores() {
            let saved = readStorage(HIGH_SCORE_CONFIG.KEY);
            let legacy = false;
            if (saved === null) {
                saved = readStorage(HIGH_SCORE_CONFIG.LEGACY_KEY);
                legacy = saved !== null;
            }
            
            let parsed = null;
            if (saved !== null) {
                try {
                    parsed = JSON.parse(saved);
                } catch (e) {
                    console.log('[HIGH SCORES] Parse error, resetting to defaults');
                }
            }
            
            const scores = parsed === null ? null : sanitizeHighScores(parsed);
            if (scores === null || scores.length === 0) {
                console.log('[HIGH SCORES] No usable saved data, using defaults');
                if (legacy) removeStorage(HIGH_SCORE_CONFIG.LEGACY_KEY);
                resetHighScores();
                return;
            }
            
            highScores = scores;
            if (legacy) {
                console.log('[HIGH SCORES] Migrated legacy high scores to', HIGH_SCORE_CONFIG.KEY);
                saveHighScores();
                removeStorage(HIGH_SCORE_CONFIG.LEGACY_KEY);
            }
        }

        function checkHighScore(score) {
            debugLog('[STATE6→7] Checking score:', score, 'against high scores:', highScores);
            if (highScores.length < HIGH_SCORE_CONFIG.MAX_ENTRIES) return true;
            
            // Find the lowest score in the list
            let lowestScore = Math.min(...highScores.map(entry => entry.score));
            debugLog('[STATE6→7] Current lowest score:', lowestScore);
            return score >= lowestScore;
        }

        function addHighScore(name, score) {
            debugLog('[STATE7→6] Adding high score:', name, score);

            const insertAt = highScores.findIndex(existing => score >= existing.score);
            if (insertAt === -1) {
                highScores.push(entry);
            } else {
                highScores.splice(insertAt, 0, entry); // A tie beats the older entry with the same score
            }
            highScores = highScores.slice(0, HIGH_SCORE_CONFIG.MAX_ENTRIES);
            debugLog('[STATE7→6] Updated high scores list:', highScores);

        // A cell is blocked if any active item or the snake already occupies it
        function isCellOccupied(x, y) {
            for (const segment of snake) {
                if (segment.x === x && segment.y === y) return true;
            }
            for (const monster of monsters) {
                if (monster.x === x && monster.y === y) return true;
            }
            if (specialFood && specialFood.x === x && specialFood.y === y) return true;
            if (iceFood && iceFood.x === x && iceFood.y === y) return true;
            return false;
        }

        function generateFood() {
            for (let attempt = 0; attempt < SPAWN_CONFIG.MAX_ATTEMPTS; attempt++) {
                const x = Math.floor(Math.random() * tileCount);
                const y = Math.floor(Math.random() * tileCount);
                if (!isCellOccupied(x, y)) {
                    food = { x: x, y: y };
                    return;
                }
            }
            food = null; // Board is effectively full - leave it empty rather than stack items
        }

            if (monsters.length < MONSTER_CONFIG.DOUBLE_UNTIL) return monsters.length;
            return MONSTER_CONFIG.WAVE_GROWTH_AFTER;

        // Spawn monster wave (STATE3→4 transition, ongoing in STATE4)
        function spawnMonsterSwarm() {
            let monstersToSpawn = getWaveSpawnCount();
            console.log('[MONSTERS] Wave', swarmRound, '- spawning', monstersToSpawn, 'monsters (total will be:', monsters.length + monstersToSpawn + ')');
            
            for (let i = 0; i < monstersToSpawn; i++) {
                let monster = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount),
                    dx: Math.random() > 0.5 ? 1 : -1,
                    dy: Math.random() > 0.5 ? 1 : -1,
                    moveCounter: 0
                };
                
                let tooClose = true;
                let attempts = 0;
                while (tooClose && attempts < SPAWN_CONFIG.MAX_ATTEMPTS) {
                    tooClose = false;
                    for (let segment of snake) {
                        let distance = Math.abs(monster.x - segment.x) + Math.abs(monster.y - segment.y);
                        if (distance < SPAWN_CONFIG.SAFE_RADIUS) {
                            tooClose = true;
                            monster.x = Math.floor(Math.random() * tileCount);
                            monster.y = Math.floor(Math.random() * tileCount);
                            break;
                        }
                    }
                    for (let existingMonster of monsters) {
                        if (monster.x === existingMonster.x && monster.y === existingMonster.y) {
                            tooClose = true;
                            monster.x = Math.floor(Math.random() * tileCount);
                            monster.y = Math.floor(Math.random() * tileCount);
                            break;
                        }
                    }
                    if (food && monster.x === food.x && monster.y === food.y) {
                        tooClose = true;
                        monster.x = Math.floor(Math.random() * tileCount);
                        monster.y = Math.floor(Math.random() * tileCount);
                    }
                    if (specialFood && monster.x === specialFood.x && monster.y === specialFood.y) {
                        tooClose = true;
                        monster.x = Math.floor(Math.random() * tileCount);
                        monster.y = Math.floor(Math.random() * tileCount);
                    }
                    if (iceFood && monster.x === iceFood.x && monster.y === iceFood.y) {
                        tooClose = true;
                        monster.x = Math.floor(Math.random() * tileCount);
                        monster.y = Math.floor(Math.random() * tileCount);
                    }
                    attempts++;

                monsters.push(monster);

            if (gameRunning) {

        // ===========================================
        // PORTAL SYSTEM (STATE4→5 transition, active STATE5)
        // ===========================================
        
        // Calculate portal threshold for any level using global config
        function getPortalThreshold(level) {
            if (level === 1) return PORTAL_CONFIG.BASE_THRESHOLD;
            
            let threshold = PORTAL_CONFIG.BASE_THRESHOLD;
            for (let i = 2; i <= level; i++) {
                const increment = PORTAL_CONFIG.BASE_INCREMENT + (i - 1) * PORTAL_CONFIG.INCREMENT_STEP;
                threshold += increment;
            }
            return threshold;
        }
        
        // Check if score threshold reached for portal (STATE4→5)
        function checkPortalActivation() {
            const previousThreshold = level === 1 ? 0 : getPortalThreshold(level - 1);
            const levelTarget = getPortalThreshold(level) - previousThreshold;
            const earnedThisLevel = totalScore - levelStartScore;
            
            if (!portal && earnedThisLevel >= levelTarget) {
                console.log('[PORTAL] Threshold reached! Earned', earnedThisLevel, 'of', levelTarget, 'this level - activating portal for level', level + 1);
                activatePortal();
            }
        }
        
        // Minimum Manhattan distance from any snake segment to one of the four portal walls
        function getPortalSideDistance(side) {
            let minDistance = Infinity;
            for (const segment of snake) {
                let distance;
                if (side === 0) distance = segment.y;                        // top
                else if (side === 1) distance = (tileCount - 1) - segment.x; // right
                else if (side === 2) distance = (tileCount - 1) - segment.y; // bottom
                else distance = segment.x;                                   // left
                if (distance < minDistance) minDistance = distance;
            }
            return minDistance;
        }
        
        // Pick a wall that keeps the safe radius from the snake; if every wall is close, take the farthest
        function choosePortalSide() {
            const safeSides = [0, 1, 2, 3].filter(side => getPortalSideDistance(side) >= SPAWN_CONFIG.SAFE_RADIUS);
            if (safeSides.length > 0) {
                return safeSides[Math.floor(Math.random() * safeSides.length)];
            }
            let farthest = 0;
            for (let side = 1; side < 4; side++) {
                if (getPortalSideDistance(side) > getPortalSideDistance(farthest)) farthest = side;
            }
            return farthest;
        }
        
        // Activate portal (STATE4→5 transition)
        function activatePortal() {
            // STATE5: Clear all monsters
            monsters = [];
            
            // STATE5: Clear all food to prevent distractions during portal phase
            food = null; // Clear regular red apple
            specialFood = null; // Clear yellow apple
            specialFoodTimer = 0;
            specialFoodDeadline = 0;
            iceFood = null; // Clear ICE apple
            iceFoodTimer = 0;

            freezeTimer = 0;

            // Create portal wall with 4-block gateway, away from the snake
            const side = choosePortalSide(); // 0=top, 1=right, 2=bottom, 3=left
            let wallBlocks = [];
            let gatewayBlocks = [];
            
            switch(side) {
                case 0: // top wall
                    {
                        let gatewayStart = Math.floor(Math.random() * (tileCount - 6)) + 3; // Leave space for 4-block gateway
                        // Create full wall
                        for (let x = 0; x < tileCount; x++) {
                            wallBlocks.push({x: x, y: 0});
                        }
                        // Mark gateway positions (snake can pass through these)
                        for (let i = 0; i < 4; i++) {
                            gatewayBlocks.push({x: gatewayStart + i, y: 0});
                        }
                    }
                    break;
                case 1: // right wall
                    {
                        let gatewayStart = Math.floor(Math.random() * (tileCount - 6)) + 3; // Leave space for 4-block gateway
                        // Create full wall
                        for (let y = 0; y < tileCount; y++) {
                            wallBlocks.push({x: tileCount - 1, y: y});
                        }
                        // Mark gateway positions
                        for (let i = 0; i < 4; i++) {
                            gatewayBlocks.push({x: tileCount - 1, y: gatewayStart + i});
                        }
                    }
                    break;
                case 2: // bottom wall
                    {
                        let gatewayStart = Math.floor(Math.random() * (tileCount - 6)) + 3; // Leave space for 4-block gateway
                        // Create full wall
                        for (let x = 0; x < tileCount; x++) {
                            wallBlocks.push({x: x, y: tileCount - 1});
                        }
                        // Mark gateway positions
                        for (let i = 0; i < 4; i++) {
                            gatewayBlocks.push({x: gatewayStart + i, y: tileCount - 1});
                        }
                    }
                    break;
                case 3: // left wall
                    {
                        let gatewayStart = Math.floor(Math.random() * (tileCount - 6)) + 3; // Leave space for 4-block gateway
                        // Create full wall
                        for (let y = 0; y < tileCount; y++) {
                            wallBlocks.push({x: 0, y: y});
                        }
                        // Mark gateway positions
                        for (let i = 0; i < 4; i++) {
                            gatewayBlocks.push({x: 0, y: gatewayStart + i});
                        }
                    }
                    break;
            }
            
            portal = {wallBlocks: wallBlocks, gatewayBlocks: gatewayBlocks, side: side};
            portalTimer = PORTAL_CONFIG.DURATION;
            portalDeadline = Date.now() + portalTimer;
            portalWarningShown = false;
            console.log('[PORTAL] Created full wall with 4-block gateway on side', side, 'at level', level, '- 15 second countdown started');
            playPortalSound();
        }

        // ===========================================
        // ANIMATION SYSTEM
        // ===========================================
        
        // Create bouncing squares (STATE6)
        function createGameOverAnimation() {
            gameOverAnimation = true;
            animatedSquares = [];
            
            // Create 30 colorful animated squares
            for (let i = 0; i < ANIMATION_CONFIG.GAME_OVER_SQUARE_COUNT; i++) {
                animatedSquares.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 6, // Random velocity X
                    vy: (Math.random() - 0.5) * 6, // Random velocity Y
                    size: Math.random() * 20 + 10, // Size between 10-30
                    color: `hsl(${Math.random() * 360}, 80%, 60%)`, // Random bright color
                    rotation: 0,
                    rotationSpeed: (Math.random() - 0.5) * 0.2
                });
            }
        }

        // Keep ambient squares moving: lift each axis that has decayed below the floor,
        // reflecting away from an edge the square is resting on
        function enforceMinimumSquareSpeed(square) {
            const min = ANIMATION_CONFIG.MIN_SQUARE_SPEED;
            
            if (Math.abs(square.vx) < min) {
                square.vx = square.vx < 0 ? -min : min;
                if (square.x <= 0 && square.vx < 0) square.vx = min;
                if (square.x >= canvas.width && square.vx > 0) square.vx = -min;
            }
            
            if (Math.abs(square.vy) < min) {
                square.vy = square.vy < 0 ? -min : min;
                if (square.y <= 0 && square.vy < 0) square.vy = min;
                if (square.y >= canvas.height && square.vy > 0) square.vy = -min;
            }
        }
        
        function updateGameOverAnimation() {
            if (!gameOverAnimation) return;
            
            for (let square of animatedSquares) {
                // Update position
                square.x += square.vx;
                square.y += square.vy;
                
                // Bounce off walls
                if (square.x <= 0 || square.x >= canvas.width) {
                    square.vx *= -0.8; // Damping
                    square.x = Math.max(0, Math.min(canvas.width, square.x));
                }
                if (square.y <= 0 || square.y >= canvas.height) {
                    square.vy *= -0.8; // Damping
                    square.y = Math.max(0, Math.min(canvas.height, square.y));
                }
                
                // Update rotation
                square.rotation += square.rotationSpeed;
                
                // Apply gravity-like effect
                square.vy += 0.1;
                
                enforceMinimumSquareSpeed(square);
                
                // Fade effect (optional - could be used later)
                square.alpha = square.alpha || 1;
            }
        }

        function drawGameOverAnimation() {
            if (!gameOverAnimation) return;
            
            ctx.save();
            for (let square of animatedSquares) {
                ctx.save();
                ctx.translate(square.x, square.y);
                ctx.rotate(square.rotation);
                ctx.fillStyle = square.color;
                ctx.fillRect(-square.size/2, -square.size/2, square.size, square.size);
                ctx.restore();
            }
            ctx.restore();
        }

        function updateTimer() {
            // Only update timer during active gameplay
            if (!gameRunning || gameState === 'gameOver' || gameState === 'nameEntry') return;
            if (startTime > 0) {
                let currentTime = Date.now();
                let elapsedTime = (currentTime - startTime) / 1000;
                document.getElementById('timeDisplay').textContent = elapsedTime.toFixed(2) + 's';
                
                // Update scores
                timeScore = timeScoreBase + Math.floor(elapsedTime * SCORING_CONFIG.TIME_POINTS_PER_SECOND); // Time scoring rate
                totalScore = timeScore + foodScore;
                
                // Check score milestones
                for (let milestone of SCORING_CONFIG.MILESTONE_BONUSES) {
                    if (totalScore >= milestone && lastMilestone < milestone) {
                        console.log('[SCORE] Milestone reached!', milestone.toLocaleString(), 'points - time:', (timeScore/SCORING_CONFIG.TIME_POINTS_PER_SECOND).toFixed(1) + 's', 'food:', foodScore);
                        lastMilestone = milestone;
                        break; // Only log one milestone per update
                    }
                }
                
                document.getElementById('foodScore').textContent = foodScore;
                document.getElementById('totalScore').textContent = totalScore;
                
                // Check for portal activation
                checkPortalActivation();
            }
        }

        function updatePortalTimer() {
            // Only update portal timer during active gameplay
            if (!gameRunning || gameState === 'gameOver' || gameState === 'nameEntry') return;
            if (portal && portalTimer > 0) {
                portalTimer = Math.max(0, portalDeadline - Date.now());
                
                // Warning at 5 seconds
                if (portalTimer <= PORTAL_CONFIG.WARNING_AT && !portalWarningShown) {
                    console.log('[PORTAL] WARNING: Only 5 seconds left to enter portal!');
                    portalWarningShown = true;
                }
                
                if (portalTimer <= 0) {
                    console.log('[PORTAL] Timer expired - Game Over! Failed to enter portal in time');
                    gameOver();
                }
            }
        }

                        let freezeIndicator = monstersAreFrozen ? " ❄️FROZEN❄️" : "";

        // Create purple squares (STATE1)
        function createStartAnimation() {
            startSquares = [];
            
            // Create 20 purple animated squares
            for (let i = 0; i < ANIMATION_CONFIG.START_SQUARE_COUNT; i++) {
                startSquares.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 4, // Random velocity X
                    vy: (Math.random() - 0.5) * 4, // Random velocity Y
                    size: Math.random() * 15 + 10, // Size between 10-25
                    rotation: 0,
                    rotationSpeed: (Math.random() - 0.5) * 0.15
                });
            }
        }

        function updateStartAnimation() {
            if (!startAnimation) return;
            
            for (let square of startSquares) {
                // Update position
                square.x += square.vx;
                square.y += square.vy;
                
                // Bounce off walls
                if (square.x <= 0 || square.x >= canvas.width) {
                    square.vx *= -0.9; // Damping
                    square.x = Math.max(0, Math.min(canvas.width, square.x));
                }
                if (square.y <= 0 || square.y >= canvas.height) {

                    square.y = Math.max(0, Math.min(canvas.height, square.y));

                // Update rotation

                // Apply slight gravity

        function drawStartAnimation() {

            ctx.save();
            for (let square of startSquares) {
                ctx.save();
                ctx.translate(square.x, square.y);
